[package]
name = "hotpot"
version = "0.1.0"
authors = ["jam1garner <jam1.mcleod@hotmail.com>"]
edition = "2018"

[package.metadata.skyline]
titleid = "01006A800016E000"

[lib]
crate-type = ["cdylib"]

[dependencies]
skyline = { git = "https://github.com/ultimate-research/skyline-rs" }
skyline_smash = { git = "https://github.com/blu-dev/skyline-smash", features = ["weak_l2cvalue"] }
smash_script = { git = "https://github.com/theincredibleplayer/smash-script", branch = "development" }
smashline = { git = "https://github.com/HDR-Development/smashline"}
smash_singletons = { git = "https://github.com/WuBoytH/smash_singletons.git" }
smash_rs = { package = "smash", git = "https://github.com/blu-dev/smash-rs" }
nnsdk = { git = "https://github.com/ultimate-research/nnsdk-rs" }
param_config = { git = "https://github.com/csharpm7/lib_paramconfig.git"}
lazy_static = "1.4.0"
parking_lot = "0.11.2"
once_cell = "1.15.0"
bitflags = "2"


[patch."https://github.com/blu-dev/skyline-smash"]
skyline_smash = { git = "https://github.com/theincredibleplayer/skyline-smash" }

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 'z'
panic = "abort"
lto = true
codegen-units = 1


